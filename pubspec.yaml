name: joes_notes
description: Joe's Notes - notes, tasks and ideas
publish_to: none
version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_quill: ^11.6.0
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  record: ^6.0.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
